name: Notify Telegram of new jobs

permissions:
  contents: write # needed to commit seen_jobs.json back

on:
  # Run right after a fresh scrape lands on main.
  push:
    branches: ["main"]
    paths:
      - "database/jobs_data.json"
  schedule:
    - cron: "0 */6 * * *" # every 6 hours, as a fallback
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.6"
          cache: "pip"

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: post new jobs to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Manual runs (workflow_dispatch) always send the current data,
          # bypassing the seen_jobs.json filter - useful for testing without
          # editing that file by hand. Scheduled/push-triggered runs keep
          # the normal new-jobs-only behavior.
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' }}
          # Per-user category preferences, set by webhook_bot/app.py. If
          # unset, notify.py just skips personalized delivery.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python notify.py
        working-directory: telegram_bot

      - name: commit updated seen_jobs.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add telegram_bot/seen_jobs.json
          git diff-index --quiet HEAD || git commit -m "Update seen jobs list"

      - name: push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
